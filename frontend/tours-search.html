    <!-- РАННЯЯ ИНИЦИАЛИЗАЦИЯ ЯЗЫКА + ЗАЩИТА ОТ FOUC.
         Выполняется СИНХРОННО при парсинге <head>, ДО первой отрисовки <body>,
         поэтому браузер никогда не показывает русский текст разметки до перевода.
         Управляется из /public/js/i18n.js (снятие защиты после перевода).
         data-cfasync="false" — критично: запрещает Cloudflare Rocket Loader
         откладывать этот скрипт. Иначе он не выполнится до первой отрисовки и
         защита от FOUC не сработает (русский текст мелькнёт на продакшене). -->
    <script data-cfasync="false">
    (function () {
        try {
            var SUPPORTED = ['en', 'ru'];
            var lang = 'en'; // Язык по умолчанию — английский (фундаментальное правило проекта)
            try {
                var sess = sessionStorage.getItem('bt_lang');
                if (sess && SUPPORTED.indexOf(sess) !== -1) {
                    lang = sess;
                } else {
                    var stored = localStorage.getItem('selectedLanguage');
                    if (stored && SUPPORTED.indexOf(stored) !== -1) {
                        lang = stored;
                        try { sessionStorage.setItem('bt_lang', lang); } catch (e) {}
                    } else {
                        try { localStorage.setItem('selectedLanguage', 'en'); } catch (e) {}
                        try { sessionStorage.setItem('bt_lang', 'en'); } catch (e) {}
                    }
                }
            } catch (e) {}

            window.currentLanguage = lang;
            try { document.documentElement.lang = lang; } catch (e) {}
            window._i18nEarlyBoot = true;

            // reveal() снимает защиту от FOUC. Определяем ВСЕГДА (безопасный no-op,
            // если прятать нечего), т.к. на него могут ссылаться другие скрипты.
            function reveal() {
                try {
                    if (window._foucSafetyTimer) { clearTimeout(window._foucSafetyTimer); window._foucSafetyTimer = null; }
                    var s = document.getElementById('i18n-fouc-prevention');
                    if (s && s.parentNode) s.parentNode.removeChild(s);
                    if (document.body) document.body.style.opacity = '';
                } catch (e) {}
            }
            window._i18nReveal = reveal;

            // КЛЮЧЕВОЕ ДЛЯ СКОРОСТИ: разметка свёрстана на АНГЛИЙСКОМ (язык по умолчанию).
            // Для английского НЕ прячем body — страница отрисовывается мгновенно, без ожидания
            // загрузки большого i18n.js. Прячем и ждём перевода ТОЛЬКО если выбран не-английский
            // язык (напр. русский), чтобы не мелькнул английский текст до перевода на русский.
            if (lang !== 'en') {
                var style = document.createElement('style');
                style.id = 'i18n-fouc-prevention';
                style.textContent = 'body{opacity:0!important}';
                (document.head || document.documentElement).appendChild(style);

                // Подстраховка: если i18n.js не загрузится/не выполнится (404, ошибка скрипта),
                // показываем страницу по событию load, чтобы она не осталась пустой.
                window.addEventListener('load', function () { setTimeout(reveal, 0); });
                // Абсолютный предохранитель на случай зависшей сети (страница не должна
                // остаться пустой навсегда). При нормальной работе таймер снимается в i18n.js.
                window._foucSafetyTimer = setTimeout(reveal, 8000);
            }
        } catch (e) {}
    })();

            font-weight: 500;

        .results-count {
            color: #6b7280;
            font-size: 14px;

                    <input

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Боковая панель фильтров -->
            <div class="lg:col-span-1">
                <div class="filter-sidebar">
                    <h3 class="text-lg font-bold mb-4" data-translate="search.filters">Filters</h3>
                    
                    <!-- Локации (Страны с городами) -->
                    <div class="filter-section" id="filter-section-locations">
                        <div class="filter-header" onclick="toggleFilter('locations')">
                            <div class="filter-title" data-translate="search.filter_locations">Locations</div>
                            <i class="fas fa-chevron-down filter-arrow chevron"></i>
                        </div>
                        <div class="filter-content" id="locations-content">
                            <div class="filter-options-wrapper" id="locations-checkboxes"></div>
                        </div>
                    </div>
                    
                    <!-- Тип тура (перемещён после городов) -->
                    <div class="filter-section" id="filter-section-tourtype">
                        <div class="filter-header" onclick="toggleFilter('tourtype')">
                            <div class="filter-title" data-translate="search.tour_type">Tour Type</div>
                            <i class="fas fa-chevron-down filter-arrow chevron"></i>
                        </div>
                        <div class="filter-content" id="tourtype-content">
                            <div class="filter-options-wrapper" id="tourtype-checkboxes">
                                <div class="filter-option">
                                    <input type="checkbox" id="tourtype-personal" value="Персональный" onchange="applyFilters()">
                                    <label for="tourtype-personal" data-translate="tour.type_personal">Private</label>
                                </div>
                                <div class="filter-option">
                                    <input type="checkbox" id="tourtype-group-personal" value="Групповой персональный" onchange="applyFilters()">
                                    <label for="tourtype-group-personal" data-translate="tour.type_group_personal">Group Private</label>
                                </div>
                                <div class="filter-option">
                                    <input type="checkbox" id="tourtype-group-common" value="Групповой общий" onchange="applyFilters()">
                                    <label for="tourtype-group-common" data-translate="tour.type_group_common">Group Shared</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Категории туров -->
                    <div class="filter-section" id="filter-section-categories">
                        <div class="filter-header" onclick="toggleFilter('categories')">
                            <div class="filter-title" data-translate="search.categories">Categories</div>
                            <i class="fas fa-chevron-down filter-arrow chevron"></i>
                        </div>
                        <div class="filter-content" id="categories-content">
                            <div class="filter-options-wrapper" id="category-checkboxes"></div>
                        </div>
                    </div>
                    
                    <!-- Блоки туров -->
                    <div class="filter-section" id="filter-section-tourblocks">
                        <div class="filter-header" onclick="toggleFilter('tourblocks')">
                            <div class="filter-title" data-translate="search.tour_blocks">Directions</div>
                            <i class="fas fa-chevron-down filter-arrow chevron"></i>
                        </div>
                        <div class="filter-content" id="tourblocks-content">
                            <div class="filter-options-wrapper" id="tourblocks-checkboxes"></div>
                        </div>
                    </div>
                    
                    <!-- Дата тура -->
                    <div class="filter-section" id="filter-section-date">
                        <div class="filter-header" onclick="toggleFilter('date')">
                            <div class="filter-title" data-translate="search.tour_date">Tour Date</div>
                            <i class="fas fa-chevron-down filter-arrow chevron"></i>
                        </div>
                        <div class="filter-content" id="date-content">
                            <div class="filter-options-wrapper">
                                <input type="text" 
                                       id="search-date-filter" 
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-600" 
                                       placeholder="DD.MM.YYYY" 
                                       data-translate-placeholder="filter.select_date"
                                       readonly>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Языки тура -->
                    <div class="filter-section" id="filter-section-languages">
                        <div class="filter-header" onclick="toggleFilter('languages')">
                            <div class="filter-title" data-translate="search.tour_languages">Tour Languages</div>
                            <i class="fas fa-chevron-down filter-arrow chevron"></i>
                        </div>
                        <div class="filter-content" id="languages-content">
                            <div class="filter-options-wrapper" id="languages-checkboxes"></div>
                        </div>
                    </div>
                    
                    <!-- Звезды отелей (только для отелей) -->

                        <div class="filter-header" onclick="toggleFilter('stars')">
                            <div class="filter-title" data-translate="search.hotel_stars">Stars</div>
                            <i class="fas fa-chevron-down filter-arrow chevron"></i>
                        </div>
                        <div class="filter-content" id="stars-content">
                            <div class="filter-options-wrapper" id="stars-checkboxes"></div>
                        </div>
                    </div>

                    <div class="filter-section" style="display:none;" id="filter-section-amenities">
                        <div class="filter-header" onclick="toggleFilter('amenities')">
                            <div class="filter-title" data-translate="search.hotel_amenities">Amenities</div>
                            <i class="fas fa-chevron-down filter-arrow chevron"></i>
                        </div>
                        <div class="filter-content" id="amenities-content">
                            <div class="filter-options-wrapper" id="amenities-checkboxes"></div>
                        </div>
                    </div>
                    
                    <div class="mobile-filter-actions">
                        <button class="search-btn lg:hidden" onclick="closeAndSearch()" style="width: 100%; padding: 12px; background: #3E3E3E; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s;" data-translate="search.search_button">Find Tours</button>
                    <button class="reset-filters-btn" onclick="location.reload()" data-translate="search.reset_filters">Reset Filters</button>
                    </div>
                </div>
            </div>
            
            <!-- Результаты поиска -->
            <div class="lg:col-span-3">
                <!-- Кнопка мобильных фильтров (в начале на мобилке) -->
                <button class="mobile-filter-btn lg:hidden" onclick="toggleMobileFilters()">
                    <i class="fas fa-filter mr-2"></i>
                    <span data-translate="search.filters">Filters</span>
                </button>
                
                <!-- Заголовок результатов -->
                <div class="results-header">
                    <div>
                        <p class="results-count mt-2">Найдено: 0</p>
                    </div>
                    
                    <select id="sort-select" class="sort-select" onchange="handleSortChange()">
                        <option value="relevance" data-translate="search.sort_relevance">By Relevance</option>
                        <option value="price_asc" data-translate="search.sort_price_asc">Price: Low to High</option>
                        <option value="price_desc" data-translate="search.sort_price_desc">Price: High to Low</option>
                        <option value="rating" data-translate="search.sort_rating">By Rating</option>
                    </select>
                </div>
                
                <!-- Контейнер для результатов туров -->
                <div id="tours-results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                
                <!-- Контейнер для результатов отелей -->
                <div id="hotels-results" class="hidden grid grid-cols-1 gap-6 md:grid-cols-2 md:gap-6 lg:grid-cols-3 lg:gap-6"></div>
                
                <!-- Загрузка -->
                <div class="loading-spinner" id="loading-spinner">
                    <i class="fas fa-spinner fa-spin text-4xl text-gray-600"></i>
                    <p class="mt-4 text-gray-600" data-translate="search.loading">Loading tours...</p>
                </div>
            </div>
        </div>
    </div>


    <!-- Динамический футер -->
    <div id="footer-container"></div>

    <!-- Модальное окно для отображения полного списка стран и городов -->
    <div id="locationModal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onclick="closeLocationModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg px-4 pt-5 pb-4 text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full sm:p-6">
                <div class="absolute top-0 right-0 pt-4 pr-4">
                    <button type="button" onclick="closeLocationModal()" class="bg-white rounded-md text-gray-400 hover:text-gray-500 focus:outline-none">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <div class="sm:flex sm:items-start">
                    <div class="mt-3 text-center sm:mt-0 sm:text-left w-full">
                        <h3 class="text-lg leading-6 font-bold text-gray-900 mb-4" id="modal-title" data-translate="location.details">Tour Location</h3>
                        <div id="modalLocationsList" class="space-y-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script data-cfasync="false">
    function openLocationModal(countries, cities, countriesWithCities) {
        const modal = document.getElementById('locationModal');
        const locationsList = document.getElementById('modalLocationsList');
        
        if (countriesWithCities && countriesWithCities.length > 0) {
            locationsList.innerHTML = countriesWithCities.map(country => {
                const citiesHtml = country.cities.length > 0 
                    ? `<ul class="ml-5 mt-1 space-y-1">${country.cities.map(city => 
                        `<li class="flex items-center gap-1 text-sm text-gray-600"><span class="text-blue-500">•</span> ${city}</li>`
                    ).join('')}</ul>`
                    : '';
                return `
                    <div class="country-group">
                        <div class="flex items-center gap-1 font-medium text-gray-800">
                            <span class="text-green-500">✓</span> ${country.name}
                        </div>
                        ${citiesHtml}
                    </div>
                `;
            }).join('');
        } else {
            let html = '';
            if (countries.length > 0) {
                html += countries.map(c => `<div class="flex items-center gap-1 font-medium text-gray-800"><span class="text-green-500">✓</span> ${c}</div>`).join('');
            }
            if (cities.length > 0) {
                html += `<ul class="ml-5 mt-2 space-y-1">${cities.map(c => `<li class="flex items-center gap-1 text-sm text-gray-600"><span class="text-blue-500">•</span> ${c}</li>`).join('')}</ul>`;
            }
            locationsList.innerHTML = html || '<p class="text-gray-400 italic">—</p>';
        }
        
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }

    function closeLocationModal() {
        document.getElementById('locationModal').classList.add('hidden');
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLocationModal();
    });
    </script>

    <script data-cfasync="false" src="/public/js/search-page.js?v=6.1"></script>
</body>
</html>
