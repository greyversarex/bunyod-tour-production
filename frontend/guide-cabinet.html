<!DOCTYPE html>
<html lang="en">
<head>
    <!-- i18n-early-boot:start -->
    <!-- РАННЯЯ ИНИЦИАЛИЗАЦИЯ ЯЗЫКА + ЗАЩИТА ОТ FOUC.
         Выполняется СИНХРОННО при парсинге <head>, ДО первой отрисовки <body>,
         поэтому браузер никогда не показывает русский текст разметки до перевода.
         Управляется из /public/js/i18n.js (снятие защиты после перевода).
         data-cfasync="false" — критично: запрещает Cloudflare Rocket Loader
         откладывать этот скрипт. Иначе он не выполнится до первой отрисовки и
         защита от FOUC не сработает (русский текст мелькнёт на продакшене). -->
    <script data-cfasync="false">
    (function () {
        try {
            var SUPPORTED = ['en', 'ru'];
            var lang = 'en'; // Язык по умолчанию — английский (фундаментальное правило проекта)
            try {
                var sess = sessionStorage.getItem('bt_lang');
                if (sess && SUPPORTED.indexOf(sess) !== -1) {
                    lang = sess;
                } else {
                    var stored = localStorage.getItem('selectedLanguage');
                    if (stored && SUPPORTED.indexOf(stored) !== -1) {
                        lang = stored;
                        try { sessionStorage.setItem('bt_lang', lang); } catch (e) {}
                    } else {
                        try { localStorage.setItem('selectedLanguage', 'en'); } catch (e) {}
                        try { sessionStorage.setItem('bt_lang', 'en'); } catch (e) {}
                    }
                }
            } catch (e) {}

            window.currentLanguage = lang;
            try { document.documentElement.lang = lang; } catch (e) {}
            window._i18nEarlyBoot = true;

            // reveal() снимает защиту от FOUC. Определяем ВСЕГДА (безопасный no-op,
            // если прятать нечего), т.к. на него могут ссылаться другие скрипты.
            function reveal() {
                try {
                    if (window._foucSafetyTimer) { clearTimeout(window._foucSafetyTimer); window._foucSafetyTimer = null; }
                    var s = document.getElementById('i18n-fouc-prevention');
                    if (s && s.parentNode) s.parentNode.removeChild(s);
                    if (document.body) document.body.style.opacity = '';
                } catch (e) {}
            }
            window._i18nReveal = reveal;

            // КЛЮЧЕВОЕ ДЛЯ СКОРОСТИ: разметка свёрстана на АНГЛИЙСКОМ (язык по умолчанию).
            // Для английского НЕ прячем body — страница отрисовывается мгновенно, без ожидания
            // загрузки большого i18n.js. Прячем и ждём перевода ТОЛЬКО если выбран не-английский
            // язык (напр. русский), чтобы не мелькнул английский текст до перевода на русский.
            if (lang !== 'en') {
                var style = document.createElement('style');
                style.id = 'i18n-fouc-prevention';
                style.textContent = 'body{opacity:0!important}';
                (document.head || document.documentElement).appendChild(style);

                // Подстраховка: если i18n.js не загрузится/не выполнится (404, ошибка скрипта),
                // показываем страницу по событию load, чтобы она не осталась пустой.
                window.addEventListener('load', function () { setTimeout(reveal, 0); });
                // Абсолютный предохранитель на случай зависшей сети (страница не должна
                // остаться пустой навсегда). При нормальной работе таймер снимается в i18n.js.
                window._foucSafetyTimer = setTimeout(reveal, 8000);
            }
        } catch (e) {}
    })();
    </script>
    <!-- i18n-early-boot:end -->

        .tour-progress-bar {
            width: 100%;
            height: 8px;

            border-radius: 4px;
            overflow: hidden;
            margin: 12px 0;

            height: 100%;
            background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
            transition: width 0.3s ease;
            border-radius: 4px;

        .tour-progress-fill.completed {
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);

            transition: background 0.2s;

    <!-- Tour Details Modal -->
    <div id="tourModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">

    <div id="rejectModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">

    <script data-cfasync="false">
        // ====== TRANSLATION HELPER ======
        const t = (key) => (window.getTranslation ? window.getTranslation(key, window.currentLanguage || 'en') : key);

        // ====== DATE LOCALE HELPER ======
        function dateLocale() {
            const lang = window.currentLanguage || 'en';
            return lang === 'ru' ? 'ru-RU' : 'en-US';
        }

        // ====== LANGUAGE SWITCHER ======
        function switchCabinetLang(lang) {
            if (window.updatePageLanguage) window.updatePageLanguage(lang);
            updateLangButtons(lang);
            document.documentElement.lang = lang;
            document.title = t('guide.cabinet_page_title');
            // Re-render dynamic content in the new language
            reRenderContent();
        }

        function updateLangButtons(lang) {
            document.getElementById('langRu').classList.toggle('active', lang === 'ru');
            document.getElementById('langEn').classList.toggle('active', lang === 'en');
        }

        // Re-render dynamic content after language change
        function reRenderContent() {
            if (currentTab === 'tours' && lastToursData.length > 0) {
                displayTours(lastToursData);
            }
            if (currentTab === 'hires' && lastHiresData.length > 0) {
                displayHires(lastHiresData);
            }
        }

        // Listen for language changes from i18n system
        document.addEventListener('languageChanged', function(e) {
            const lang = e.detail && e.detail.language ? e.detail.language : (window.currentLanguage || 'en');
            updateLangButtons(lang);
            document.documentElement.lang = lang;
            document.title = t('guide.cabinet_page_title');
            if (window.renderGuideName) window.renderGuideName(lang);
            reRenderContent();
        });

        // ====== STATE ======
        let currentTourId = null;
        let currentTab = 'tours';
        let hiresLoaded = false;
        let currentHiresFilter = 'all';
        let currentRejectHireId = null;
        let lastToursData = [];
        let lastHiresData = [];

        // ====== AUTHENTICATION CHECK ======
        document.addEventListener('DOMContentLoaded', async function() {
            // Init language buttons
            const lang = window.currentLanguage || 'en';
            updateLangButtons(lang);

            const token = localStorage.getItem('tourGuideToken');
            const guideData = localStorage.getItem('tourGuideData');

            if (!token || !guideData) {
                window.location.href = '/guide-login.html';
                return;
            }

            const guide = JSON.parse(guideData);

            // Helper: extract localized guide name from string or object
            window._guideNameRaw = guide.name;
            window._guideLogin = guide.login;
            function renderGuideName(lang) {
                const raw = window._guideNameRaw;
                let name = window._guideLogin;
                if (raw) {
                    if (typeof raw === 'object' && raw !== null) {
                        name = raw[lang] || raw.ru || raw.en || window._guideLogin;
                    } else if (typeof raw === 'string') {
                        try {
                            const parsed = JSON.parse(raw);
                            name = parsed[lang] || parsed.ru || parsed.en || window._guideLogin;
                        } catch (e) {
                            name = raw;
                        }
                    }
                }
                document.getElementById('guideName').textContent = name || window._guideLogin;
            }
            window.renderGuideName = renderGuideName;
            renderGuideName(window.currentLanguage || 'ru');

            loadTours();
        });

        // ====== LOAD TOURS ======
        async function loadTours() {
            try {
                const token = localStorage.getItem('tourGuideToken');
                const response = await fetch('/api/guide/tours', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('tourGuideToken');
                        window.location.href = '/guide-login.html';
                    }
                    throw new Error('Failed to load tours');
                }

                const data = await response.json();
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

                if (data.success && data.data && data.data.length > 0) {
                    lastToursData = data.data;
                    document.getElementById('noTours').classList.add('hidden');
                    displayTours(data.data);
                } else {
                    lastToursData = [];
                    document.getElementById('toursContainer').innerHTML = '';
                    document.getElementById('noTours').classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error loading tours:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
                document.getElementById('errorMsg').textContent = error.message;
            }
        }

        // ====== DISPLAY TOURS ======
        function displayTours(tours) {
            const container = document.getElementById('toursContainer');
            const lang = window.currentLanguage || 'en';
            container.innerHTML = tours.map(tour => {
                const title = typeof tour.title === 'object'
                    ? (tour.title[lang] || tour.title.en || tour.title.ru || t('guide.no_title'))
                    : (tour.title || t('guide.no_title'));

                const statusBadge = getStatusBadge(tour.status);
                const startDate = new Date(tour.scheduledStartDate).toLocaleDateString(dateLocale());
                const progressPct = tour.status === 'finished' || tour.status === 'completed'
                    ? 100
                    : Math.round((tour.currentDay || 0) / (tour.totalDays || 1) * 100);

                return `
                    <div class="bg-white rounded-lg shadow-md hover:shadow-lg transition-all p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex-1">
                                <h3 class="text-xl font-bold text-gray-800">${title}</h3>
                                <p class="text-gray-600 text-sm">
                                    <i class="fas fa-hashtag mr-1"></i>
                                    ${t('guide.tour_code')}: ${tour.uniqueCode}
                                </p>
                            </div>
                            <span class="${statusBadge.class}">
                                <i class="fas ${statusBadge.icon} mr-1"></i>
                                ${statusBadge.text}
                            </span>
                        </div>

                        <div class="grid grid-cols-3 gap-4 mb-4 text-sm text-gray-600">
                            <div>
                                <i class="fas fa-calendar mr-1 text-blue-600"></i>
                                ${t('guide.dates')}: ${startDate}
                            </div>
                            <div>
                                <i class="fas fa-users mr-1 text-green-600"></i>
                                ${t('guide.tourists')}: ${tour.totalTourists}
                            </div>
                            <div>
                                <i class="fas fa-map-marker-alt mr-1 text-red-600"></i>
                                ${t('guide.day_label')}: ${tour.currentDay || 0}/${tour.totalDays || 0}
                            </div>
                        </div>

                        ${(tour.status === 'active' || tour.status === 'finished' || tour.status === 'completed') ? `
                            <div class="mb-4">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="day-indicator">
                                        <i class="fas fa-route"></i>
                                        ${t('guide.tour_progress')}
                                    </span>
                                    <span class="text-sm font-semibold ${(tour.status === 'finished' || tour.status === 'completed') ? 'text-green-600' : 'text-blue-600'}">
                                        ${(tour.status === 'finished' || tour.status === 'completed') ? t('guide.completed_label') : progressPct + '%'}
                                    </span>
                                </div>
                                <div class="tour-progress-bar">
                                    <div class="tour-progress-fill ${(tour.status === 'finished' || tour.status === 'completed') ? 'completed' : ''}" 
                                         style="width: ${progressPct}%"></div>
                                </div>
                                <div class="text-xs text-gray-500 mt-1">
                                    ${tour.completedDays && tour.completedDays.length > 0
                                        ? `${t('guide.days_completed')}: ${tour.completedDays.length}`
                                        : (tour.status === 'active' ? t('guide.tour_in_progress') : t('guide.tour_finished'))}
                                </div>
                            </div>
                        ` : ''}

                        <button onclick="showTourDetails(${tour.id})" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-all">
                            <i class="fas fa-eye mr-1"></i>
                            ${t('guide.view_details')}
                        </button>
                    </div>
                `;
            }).join('');
        }

        // ====== STATUS BADGE ======
        function getStatusBadge(status) {
            const statuses = {
                'scheduled': { text: t('guide.status_scheduled'), icon: 'fa-calendar', class: 'px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm font-semibold' },
                'active':    { text: t('guide.status_active'),    icon: 'fa-play-circle', class: 'px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm font-semibold' },
                'finished':  { text: t('guide.status_finished'),  icon: 'fa-check-circle', class: 'px-3 py-1 bg-gray-100 text-gray-800 rounded-full text-sm font-semibold' },
                'completed': { text: t('guide.status_finished'),  icon: 'fa-check-circle', class: 'px-3 py-1 bg-gray-100 text-gray-800 rounded-full text-sm font-semibold' },
                'cancelled': { text: t('guide.status_cancelled'), icon: 'fa-times-circle', class: 'px-3 py-1 bg-red-100 text-red-800 rounded-full text-sm font-semibold' }
            };
            return statuses[status] || statuses['scheduled'];
        }

        // ====== TOUR DETAILS MODAL ======
        async function showTourDetails(tourId) {
            try {
                currentTourId = tourId;
                const token = localStorage.getItem('tourGuideToken');
                const lang = window.currentLanguage || 'en';

                const response = await fetch(`/api/guide/tours/${tourId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Failed to load tour details');

                const data = await response.json();
                const tour = data.data;
                
                const title = typeof tour.title === 'object'
                    ? (tour.title[lang] || tour.title.en || tour.title.ru || t('guide.no_title'))
                    : (tour.title || t('guide.no_title'));

                document.getElementById('modalTitle').textContent = title;
                
                const progressPct = (tour.status === 'finished' || tour.status === 'completed')
                    ? 100
                    : Math.round((tour.currentDay || 0) / (tour.totalDays || 1) * 100);

                const details = `
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div>
                            <p class="text-gray-600 text-sm">${t('guide.status')}</p>
                            <p class="font-semibold">${getStatusBadge(tour.status).text}</p>
                        </div>
                        <div>
                            <p class="text-gray-600 text-sm">${t('guide.day_label')}</p>
                            <p class="font-semibold">${tour.currentDay || 0}/${tour.totalDays || 0}</p>
                        </div>
                        <div>
                            <p class="text-gray-600 text-sm">${t('guide.tourists')}</p>
                            <p class="font-semibold">${tour.totalTourists || 0} ${t('guide.persons')}</p>
                        </div>
                        <div>
                            <p class="text-gray-600 text-sm">${t('guide.bookings_count')}</p>
                            <p class="font-semibold">${tour.bookings ? tour.bookings.length : 0}</p>
                        </div>
                    </div>

                    ${(tour.status === 'active' || tour.status === 'finished' || tour.status === 'completed') ? `
                        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 p-4 rounded-lg mb-6">
                            <div class="flex justify-between items-center mb-3">
                                <h4 class="font-bold text-gray-800 flex items-center gap-2">
                                    <i class="fas fa-chart-line text-blue-600"></i>
                                    ${t('guide.tour_progress')}
                                </h4>
                                <span class="text-lg font-bold ${(tour.status === 'finished' || tour.status === 'completed') ? 'text-green-600' : 'text-blue-600'}">
                                    ${progressPct}%
                                </span>
                            </div>
                            <div class="tour-progress-bar" style="height: 12px;">
                                <div class="tour-progress-fill ${(tour.status === 'finished' || tour.status === 'completed') ? 'completed' : ''}" 
                                     style="width: ${progressPct}%"></div>
                            </div>
                            ${tour.completedDays && tour.completedDays.length > 0 ? `
                                <div class="mt-4">
                                    <p class="text-sm font-semibold text-gray-700 mb-2">${t('guide.completed_days_label')}:</p>
                                    <div class="flex flex-wrap gap-2">
                                        ${Array.from({length: tour.totalDays || 0}, (_, i) => i + 1).map(day => {
                                            const isCompleted = tour.completedDays.includes(day);
                                            const isCurrent = day === tour.currentDay;
                                            return `
                                                <span class="px-3 py-1 rounded-full text-sm font-semibold
                                                    ${isCompleted ? 'bg-green-100 text-green-800' :
                                                      isCurrent ? 'bg-blue-100 text-blue-800 ring-2 ring-blue-400' :
                                                      'bg-gray-100 text-gray-400'}">
                                                    ${isCompleted ? '✓' : isCurrent ? '▶' : ''} ${t('guide.day_label')} ${day}
                                                </span>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    ` : ''}

                    ${tour.itinerary ? `
                        <div class="mt-6 bg-gray-50 p-4 rounded-lg">
                            <p class="font-semibold text-gray-800 mb-3 flex items-center gap-2">
                                <i class="fas fa-route text-blue-600"></i> ${t('guide.tour_program')}
                            </p>
                            <div class="space-y-3 text-sm">
                                ${(() => {
                                    try {
                                        const days = JSON.parse(tour.itinerary);
                                        if (Array.isArray(days)) {
                                            return days.map((day, i) => {
                                                const dayTitle = typeof day.title === 'object'
                                                    ? (day.title[lang] || day.title.en || day.title.ru || '')
                                                    : (day.title || '');
                                                const dayDesc = typeof day.description === 'object'
                                                    ? (day.description[lang] || day.description.en || day.description.ru || '')
                                                    : (day.description || day.text || '');
                                                return `
                                                    <div class="border-l-4 border-blue-500 pl-3 bg-white p-3 rounded">
                                                        <p class="font-semibold text-blue-800">${t('guide.day_label')} ${i+1}${dayTitle ? ': ' + dayTitle : ''}</p>
                                                        <p class="text-gray-600 mt-1">${dayDesc}</p>
                                                    </div>
                                                `;
                                            }).join('');
                                        }
                                        return `<p class="text-gray-600">${tour.itinerary}</p>`;
                                    } catch (e) {
                                        return `<p class="text-gray-600 whitespace-pre-line">${tour.itinerary}</p>`;
                                    }
                                })()}
                            </div>
                        </div>
                    ` : ''}
                    
                    ${tour.bookings && tour.bookings.length > 0 ? `
                        <div class="mt-4">
                            <p class="text-gray-600 text-sm mb-2">${t('guide.tourists')}:</p>
                            <ul class="space-y-1 text-sm">
                                ${tour.bookings.map(b => `<li class="text-gray-700">• ${b.customerName || t('guide.customer')} (${b.numberOfTourists} ${t('guide.persons')})</li>`).join('')}
                            </ul>
                        </div>
                    ` : ''}
                    ${(tour.status === 'finished' || tour.status === 'completed') ? `
                        <div class="mt-4">
                            <button onclick="collectTourReviews(${tourId})" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg transition-all">
                                <i class="fas fa-star mr-1"></i> ${t('btn.collect_reviews')}
                            </button>
                        </div>
                    ` : ''}
                `;

                document.getElementById('modalContent').innerHTML = details;

                const actions = `
                    ${tour.status === 'scheduled' ? `
                        <button onclick="startTour(${tourId})" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition-all">
                            <i class="fas fa-play mr-1"></i> ${t('btn.start_tour')}
                        </button>
                    ` : ''}
                    ${tour.status === 'active' ? `
                        <button onclick="finishDay(${tourId})" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg transition-all">
                            <i class="fas fa-check mr-1"></i> ${t('btn.finish_day')}
                        </button>
                        ${tour.currentDay === tour.totalDays ? `
                            <button onclick="finishTour(${tourId})" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition-all">
                                <i class="fas fa-flag-checkered mr-1"></i> ${t('btn.finish_tour')}
                            </button>
                        ` : ''}
                    ` : ''}
                    ${(tour.status === 'finished' || tour.status === 'completed') ? `
                        <button onclick="collectTourReviews(${tourId})" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg transition-all">
                            <i class="fas fa-star mr-1"></i> ${t('btn.collect_reviews')}
                        </button>
                    ` : ''}
                `;

                document.getElementById('modalActions').innerHTML = actions;
                document.getElementById('tourModal').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading tour details:', error);
                alert(t('guide.error_tour_details'));
            }
        }

        async function startTour(tourId) {
            if (!confirm(t('guide.confirm_start_tour'))) return;
            await performAction(tourId, 'start');
        }

        async function finishDay(tourId) {
            if (!confirm(t('guide.confirm_finish_day'))) return;
            await performAction(tourId, 'finish');
        }

        async function finishTour(tourId) {
            if (!confirm(t('guide.confirm_finish_tour'))) return;
            await performAction(tourId, 'finish');
        }

        async function collectTourReviews(tourId) {
            try {
                const token = localStorage.getItem('tourGuideToken');
                const response = await fetch(`/api/guide/tours/${tourId}/collect-reviews`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                if (data.success) {
                    alert(t('guide.collect_reviews_success'));
                    closeModal();
                } else {
                    alert(data.message || t('guide.collect_reviews_error'));
                }
            } catch (error) {
                console.error('Error collecting reviews:', error);
                alert(t('guide.collect_reviews_error'));
            }
        }

        async function performAction(tourId, action) {
            try {
                const token = localStorage.getItem('tourGuideToken');
                const response = await fetch(`/api/guide/tours/${tourId}/${action}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                if (response.ok) {
                    closeModal();
                    loadTours();
                } else {
                    alert(t('guide.error_action'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert(t('guide.error_connection'));
            }
        }

        function closeModal() {
            document.getElementById('tourModal').classList.add('hidden');
        }

        function logout() {
            if (!confirm(t('guide.logout_confirm'))) return;
            localStorage.removeItem('tourGuideToken');
            localStorage.removeItem('tourGuideData');
            window.location.href = '/guide-login.html';
        }

        // Close modal on outside click
        document.getElementById('tourModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ====== TAB SWITCHING ======
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-blue-500', 'text-blue-600');
                btn.classList.add('border-transparent', 'text-gray-500');
            });
            const activeBtn = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
            if (activeBtn) {
                activeBtn.classList.remove('border-transparent', 'text-gray-500');
                activeBtn.classList.add('border-blue-500', 'text-blue-600');
            }
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            document.getElementById(tab + 'Tab').classList.remove('hidden');
            if (tab === 'hires' && !hiresLoaded) {
                loadHires();
            }
        }

        // ====== HIRES MANAGEMENT ======
        async function loadHires(status = 'all') {
            const token = localStorage.getItem('tourGuideToken');
            if (!token) return;

            document.getElementById('hiresLoading').classList.remove('hidden');
            document.getElementById('hiresContainer').innerHTML = '';
            document.getElementById('noHires').classList.add('hidden');

            try {
                const url = status === 'all'
                    ? '/api/guide-hire/my-hires'
                    : '/api/guide-hire/my-hires?status=' + status;
                    
                const response = await fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                document.getElementById('hiresLoading').classList.add('hidden');

                if (data.success && data.data.hires && data.data.hires.length > 0) {
                    hiresLoaded = true;
                    lastHiresData = data.data.hires;
                    displayHires(data.data.hires);
                    const countBadge = document.getElementById('hiresCount');
                    countBadge.textContent = data.data.pagination.totalAll || data.data.pagination.total;
                    countBadge.classList.remove('hidden');
                } else {
                    lastHiresData = [];
                    document.getElementById('noHires').classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error loading hires:', error);
                document.getElementById('hiresLoading').classList.add('hidden');
                document.getElementById('noHires').classList.remove('hidden');
            }
        }

        function filterHires(status) {
            currentHiresFilter = status;
            document.querySelectorAll('.hire-filter-btn').forEach(btn => {
                btn.classList.remove('bg-gray-800', 'text-white', 'active');
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            event.target.classList.remove('bg-gray-200', 'text-gray-700');
            event.target.classList.add('bg-gray-800', 'text-white', 'active');
            loadHires(status);
        }

        function displayHires(hires) {
            const container = document.getElementById('hiresContainer');
            container.innerHTML = hires.map(hire => {
                const statusBadge = getHireStatusBadge(hire.status);
                const paymentBadge = getPaymentStatusBadge(hire.paymentStatus);
                const guideResponseBadge = getGuideResponseBadge(hire.guideResponse);
                
                let datesStr = '-';
                if (hire.selectedDates) {
                    const dates = Array.isArray(hire.selectedDates) ? hire.selectedDates : [];
                    if (dates.length > 0) {
                        datesStr = dates.map(d => new Date(d).toLocaleDateString(dateLocale())).join(', ');
                    }
                }

                const showActionButtons = hire.guideResponse === 'pending' && (hire.status === 'pending' || hire.status === 'approved');

                return `
                    <div class="bg-white rounded-lg shadow-md hover:shadow-lg transition-all p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex-1">
                                <h3 class="text-lg font-bold text-gray-800">
                                    <i class="fas fa-user mr-2 text-blue-500"></i>
                                    ${hire.touristName || hire.customerName || t('guide.customer')}
                                </h3>
                                <p class="text-gray-600 text-sm mt-1">
                                    <i class="fas fa-envelope mr-1"></i> ${hire.touristEmail || hire.customerEmail || '-'}
                                    ${(hire.touristPhone || hire.customerPhone) ? '<br><i class="fas fa-phone mr-1"></i>' + (hire.touristPhone || hire.customerPhone) : ''}
                                </p>
                            </div>
                            <div class="flex flex-col gap-2 items-end">
                                ${guideResponseBadge}
                                ${statusBadge}
                                ${paymentBadge}
                            </div>
                        </div>

                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4 text-sm">
                            <div class="bg-gray-50 p-3 rounded-lg">
                                <p class="text-gray-500 text-xs">${t('guide.hire_dates')}</p>
                                <p class="font-semibold text-gray-800">${datesStr}</p>
                            </div>
                            <div class="bg-gray-50 p-3 rounded-lg">
                                <p class="text-gray-500 text-xs">${t('guide.hire_days')}</p>
                                <p class="font-semibold text-gray-800">${hire.numberOfDays || hire.daysCount || 0}</p>
                            </div>
                            <div class="bg-gray-50 p-3 rounded-lg">
                                <p class="text-gray-500 text-xs">${t('guide.hire_price_per_day')}</p>
                                <p class="font-semibold text-gray-800">${hire.pricePerDay || 0} ${hire.currency || 'TJS'}</p>
                            </div>
                            <div class="bg-green-50 p-3 rounded-lg">
                                <p class="text-gray-500 text-xs">${t('guide.hire_total')}</p>
                                <p class="font-bold text-green-600">${hire.totalPrice || 0} ${hire.currency || 'TJS'}</p>
                            </div>
                        </div>

                        ${hire.comments ? `
                            <div class="bg-yellow-50 p-3 rounded-lg text-sm mb-4">
                                <p class="text-gray-600"><i class="fas fa-comment mr-1"></i> ${hire.comments}</p>
                            </div>
                        ` : ''}

                        ${hire.guideResponseNote ? `
                            <div class="bg-blue-50 p-3 rounded-lg text-sm mb-4">
                                <p class="text-blue-700"><i class="fas fa-reply mr-1"></i> <strong>${t('guide.your_response')}:</strong> ${hire.guideResponseNote}</p>
                            </div>
                        ` : ''}

                        ${showActionButtons ? `
                            <div class="flex gap-3 mb-4">
                                <button onclick="respondToHire(${hire.id}, 'accepted')" 
                                    class="flex-1 bg-green-600 hover:bg-green-700 text-white px-4 py-3 rounded-lg transition-all font-semibold">
                                    <i class="fas fa-check mr-2"></i>${t('guide.accept_hire')}
                                </button>
                                <button onclick="showRejectModal(${hire.id})" 
                                    class="flex-1 bg-red-600 hover:bg-red-700 text-white px-4 py-3 rounded-lg transition-all font-semibold">
                                    <i class="fas fa-times mr-2"></i>${t('guide.reject_hire')}
                                </button>
                            </div>
                        ` : ''}

                        <div class="pt-4 border-t border-gray-100 text-xs text-gray-500 flex justify-between">
                            <span><i class="fas fa-clock mr-1"></i> ${t('guide.hire_created')}: ${new Date(hire.createdAt).toLocaleString(dateLocale())}</span>
                            ${hire.guideRespondedAt ? `<span><i class="fas fa-reply mr-1"></i> ${t('guide.hire_responded')}: ${new Date(hire.guideRespondedAt).toLocaleString(dateLocale())}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ====== BADGE HELPERS ======
        function getGuideResponseBadge(response) {
            const badges = {
                'pending':  `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-orange-100 text-orange-800"><i class="fas fa-hourglass-half mr-1"></i>${t('guide.hire_response_pending')}</span>`,
                'accepted': `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-800"><i class="fas fa-thumbs-up mr-1"></i>${t('guide.hire_response_accepted')}</span>`,
                'rejected': `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-800"><i class="fas fa-thumbs-down mr-1"></i>${t('guide.hire_response_rejected')}</span>`
            };
            return badges[response] || badges['pending'];
        }

        function getHireStatusBadge(status) {
            const badges = {
                'pending':   `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-800"><i class="fas fa-clock mr-1"></i>${t('guide.hire_status_pending')}</span>`,
                'approved':  `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-800"><i class="fas fa-check mr-1"></i>${t('guide.hire_status_approved')}</span>`,
                'rejected':  `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-800"><i class="fas fa-times mr-1"></i>${t('guide.hire_status_rejected')}</span>`,
                'completed': `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-800"><i class="fas fa-flag-checkered mr-1"></i>${t('guide.hire_status_completed')}</span>`,
                'cancelled': `<span class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-800"><i class="fas fa-ban mr-1"></i>${t('guide.hire_status_cancelled')}</span>`
            };
            return badges[status] || badges['pending'];
        }

        function getPaymentStatusBadge(status) {
            const badges = {
                'unpaid':   `<span class="px-2 py-0.5 rounded text-xs bg-red-50 text-red-600"><i class="fas fa-times-circle mr-1"></i>${t('guide.payment_unpaid')}</span>`,
                'paid':     `<span class="px-2 py-0.5 rounded text-xs bg-green-50 text-green-600"><i class="fas fa-check-circle mr-1"></i>${t('guide.payment_paid')}</span>`,
                'refunded': `<span class="px-2 py-0.5 rounded text-xs bg-gray-50 text-gray-600"><i class="fas fa-undo mr-1"></i>${t('guide.payment_refunded')}</span>`
            };
            return badges[status] || badges['unpaid'];
        }

        // ====== HIRE RESPOND ======
        async function respondToHire(hireId, response, note = '') {
            const token = localStorage.getItem('tourGuideToken');
            if (!token) return;
            try {
                const res = await fetch(`/api/guide-hire/my-hires/${hireId}/respond`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ response, note })
                });
                const data = await res.json();
                if (data.success) {
                    alert(response === 'accepted' ? t('guide.hire_accepted_alert') : t('guide.hire_rejected_alert'));
                    loadHires(currentHiresFilter);
                } else {
                    alert(data.message || t('guide.error_hire_response'));
                }
            } catch (error) {
                console.error('Error responding to hire:', error);
                alert(t('guide.error_connection'));
            }
        }

        function showRejectModal(hireId) {
            currentRejectHireId = hireId;
            document.getElementById('rejectNoteInput').value = '';
            document.getElementById('rejectModal').classList.remove('hidden');
        }

        function closeRejectModal() {
            currentRejectHireId = null;
            document.getElementById('rejectModal').classList.add('hidden');
        }

        function confirmReject() {
            if (!currentRejectHireId) return;
            const note = document.getElementById('rejectNoteInput').value.trim();
            respondToHire(currentRejectHireId, 'rejected', note);
            closeRejectModal();
        }
    </script>
</body>
</html>
