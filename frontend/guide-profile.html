<!DOCTYPE html>

<head>
    <!-- i18n-early-boot:start -->
    <!-- РАННЯЯ ИНИЦИАЛИЗАЦИЯ ЯЗЫКА + ЗАЩИТА ОТ FOUC.
         Выполняется СИНХРОННО при парсинге <head>, ДО первой отрисовки <body>,
         поэтому браузер никогда не показывает русский текст разметки до перевода.
         Управляется из /public/js/i18n.js (снятие защиты после перевода).
         data-cfasync="false" — критично: запрещает Cloudflare Rocket Loader
         откладывать этот скрипт. Иначе он не выполнится до первой отрисовки и
         защита от FOUC не сработает (русский текст мелькнёт на продакшене). -->
    <script data-cfasync="false">
    (function () {
        try {
            var SUPPORTED = ['en', 'ru'];
            var lang = 'en'; // Язык по умолчанию — английский (фундаментальное правило проекта)
            try {
                var sess = sessionStorage.getItem('bt_lang');
                if (sess && SUPPORTED.indexOf(sess) !== -1) {
                    lang = sess;
                } else {
                    var stored = localStorage.getItem('selectedLanguage');
                    if (stored && SUPPORTED.indexOf(stored) !== -1) {
                        lang = stored;
                        try { sessionStorage.setItem('bt_lang', lang); } catch (e) {}
                    } else {
                        try { localStorage.setItem('selectedLanguage', 'en'); } catch (e) {}
                        try { sessionStorage.setItem('bt_lang', 'en'); } catch (e) {}
                    }
                }
            } catch (e) {}

            window.currentLanguage = lang;
            try { document.documentElement.lang = lang; } catch (e) {}
            window._i18nEarlyBoot = true;

            // reveal() снимает защиту от FOUC. Определяем ВСЕГДА (безопасный no-op,
            // если прятать нечего), т.к. на него могут ссылаться другие скрипты.
            function reveal() {
                try {
                    if (window._foucSafetyTimer) { clearTimeout(window._foucSafetyTimer); window._foucSafetyTimer = null; }
                    var s = document.getElementById('i18n-fouc-prevention');
                    if (s && s.parentNode) s.parentNode.removeChild(s);
                    if (document.body) document.body.style.opacity = '';
                } catch (e) {}
            }
            window._i18nReveal = reveal;

            // КЛЮЧЕВОЕ ДЛЯ СКОРОСТИ: разметка свёрстана на АНГЛИЙСКОМ (язык по умолчанию).
            // Для английского НЕ прячем body — страница отрисовывается мгновенно, без ожидания
            // загрузки большого i18n.js. Прячем и ждём перевода ТОЛЬКО если выбран не-английский
            // язык (напр. русский), чтобы не мелькнул английский текст до перевода на русский.
            if (lang !== 'en') {
                var style = document.createElement('style');
                style.id = 'i18n-fouc-prevention';
                style.textContent = 'body{opacity:0!important}';
                (document.head || document.documentElement).appendChild(style);

                // Подстраховка: если i18n.js не загрузится/не выполнится (404, ошибка скрипта),
                // показываем страницу по событию load, чтобы она не осталась пустой.
                window.addEventListener('load', function () { setTimeout(reveal, 0); });
                // Абсолютный предохранитель на случай зависшей сети (страница не должна
                // остаться пустой навсегда). При нормальной работе таймер снимается в i18n.js.
                window._foucSafetyTimer = setTimeout(reveal, 8000);
            }
        } catch (e) {}
    })();
    </script>

    <script data-cfasync="false">
        let guideData = null;
        let guideStats = null; // Сохраняем статистику для использования при переключении языка
        const API_BASE = `${window.location.protocol}//${window.location.hostname}:${window.location.port}/api`;

        // Get guide ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const guideId = urlParams.get('id');

        if (!guideId) {
            showError();
        } else {
            loadGuideProfile();
        }

        async function loadGuideProfile() {
            try {
                const lang = getCurrentLanguage();
                console.log('Loading guide profile for ID:', guideId, 'Language:', lang);

                // Load guide data
                const guideResponse = await fetch(`${API_BASE}/guides/${guideId}?lang=${lang}`);
                if (!guideResponse.ok) throw new Error('Guide not found');
                
                const guideResult = await guideResponse.json();
                guideData = guideResult.data;

                // Загружаем актуальную статистику из обеих таблиц отзывов
                const statsResponse = await fetch(`${API_BASE}/guide-reviews/guide/${guideId}/stats`);
                const statsResult = await statsResponse.json();
                guideStats = statsResult.data; // Сохраняем для повторного использования

                displayGuide(guideData, guideStats);

                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('guide-profile').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading guide profile:', error);
                showError();
            }
        }

        function displayGuide(guide, stats = null) {
            const lang = getCurrentLanguage();

            // Photo
            const photoEl = document.getElementById('guide-photo');
            if (guide.photo) {
                // If photo already has full path (starts with / or http), use it as is
                if (guide.photo.startsWith('/') || guide.photo.startsWith('http')) {
                    photoEl.src = guide.photo;
                } else {
                    photoEl.src = `/uploads/guides/${guide.photo}`;
                }
            } else if (guide.avatar) {
                // Same logic for avatar
                if (guide.avatar.startsWith('/') || guide.avatar.startsWith('http')) {
                    photoEl.src = guide.avatar;
                } else {
                    photoEl.src = `/uploads/guides/${guide.avatar}`;
                }
            } else {
                photoEl.src = '/uploads/guides/default-guide.jpg';
            }

            // Name - handle multilingual object
            const guideName = getMultilingualText(guide.name, lang) || (lang === 'ru' ? 'Не указано' : 'Not specified');
            document.getElementById('guide-name').textContent = guideName;

            // Rating - используем актуальные данные из статистики или из модели гида
            const rating = stats?.averageRating ?? guide.rating ?? 0;
            const totalReviews = stats?.totalReviews ?? guide.reviewsCount ?? 0;
            
            document.getElementById('guide-rating').textContent = rating.toFixed(1);
            displayStars(rating, 'guide-stars');
            
            // Количество оценок
            const ratingText = lang === 'ru' 
                ? `(${totalReviews} ${getRatingsWord(totalReviews)})`
                : `(${totalReviews} rating${totalReviews !== 1 ? 's' : ''})`;
            document.getElementById('guide-review-count').textContent = ratingText;

            // Experience
            const experienceText = guide.experience ? 
                `${guide.experience} ${lang === 'ru' ? 'лет опыта' : 'years of experience'}` : 
                (lang === 'ru' ? 'Не указано' : 'Not specified');
            document.getElementById('guide-experience').textContent = experienceText;

            // Languages - translate language names to current language
            const languageTranslations = {
                // Russian language names
                'Русский': { ru: 'Русский', en: 'Russian' },
                'Английский': { ru: 'Английский', en: 'English' },
                'Французский': { ru: 'Французский', en: 'French' },
                'Немецкий': { ru: 'Немецкий', en: 'German' },
                'Испанский': { ru: 'Испанский', en: 'Spanish' },
                'Итальянский': { ru: 'Итальянский', en: 'Italian' },
                'Китайский': { ru: 'Китайский', en: 'Chinese' },
                'Японский': { ru: 'Японский', en: 'Japanese' },
                'Таджикский': { ru: 'Таджикский', en: 'Tajik' },
                'Узбекский': { ru: 'Узбекский', en: 'Uzbek' },
                'Персидский': { ru: 'Персидский', en: 'Persian' },
                'Арабский': { ru: 'Арабский', en: 'Arabic' },
                'Турецкий': { ru: 'Турецкий', en: 'Turkish' },
                'Корейский': { ru: 'Корейский', en: 'Korean' },
                'Португальский': { ru: 'Португальский', en: 'Portuguese' },
            };
            
            let languagesText = lang === 'ru' ? 'Не указано' : 'Not specified';
            if (guide.languages) {
                if (Array.isArray(guide.languages)) {
                    languagesText = guide.languages
                        .map(l => languageTranslations[l]?.[lang] || l)
                        .join(', ');
                } else if (typeof guide.languages === 'object' && !Array.isArray(guide.languages)) {
                    languagesText = getMultilingualText(guide.languages, lang);
                } else if (typeof guide.languages === 'string') {
                    // Parse comma-separated string and translate
                    const langs = guide.languages.split(',').map(l => l.trim());
                    languagesText = langs
                        .map(l => languageTranslations[l]?.[lang] || l)
                        .join(', ');
                }
            }
            document.getElementById('guide-languages').textContent = languagesText;

            // Region - use separate nameRu/nameEn fields or fallback to name JSONB
            let regionText = '';
            if (guide.guideCountry) {
                // Try to get localized name from separate fields first
                const countryName = lang === 'en' 
                    ? (guide.guideCountry.nameEn || guide.guideCountry.nameRu || getMultilingualText(guide.guideCountry.name, lang))
                    : (guide.guideCountry.nameRu || guide.guideCountry.nameEn || getMultilingualText(guide.guideCountry.name, lang));
                regionText = countryName;
                
                if (guide.guideCity) {
                    // Try to get localized name from separate fields first
                    const cityName = lang === 'en'
                        ? (guide.guideCity.nameEn || guide.guideCity.nameRu || getMultilingualText(guide.guideCity.name, lang))
                        : (guide.guideCity.nameRu || guide.guideCity.nameEn || getMultilingualText(guide.guideCity.name, lang));
                    if (cityName) {
                        regionText += `, ${cityName}`;
                    }
                }
            }
            
            if (!regionText) {
                regionText = lang === 'ru' ? 'Не указано' : 'Not specified';
            }
            document.getElementById('guide-region').textContent = regionText;

            // Certificate ID в заголовке
            const certificateId = guide.registration || '—';
            document.getElementById('certificate-id').textContent = certificateId;

            // Description - handle multilingual object
            const descriptionText = getMultilingualText(guide.description, lang) || (lang === 'ru' ? 'Описание отсутствует' : 'No description available');
            document.getElementById('guide-description').textContent = descriptionText;
        }

        // Helper function to get text from multilingual field
        function getMultilingualText(field, language) {
            if (!field) return '';
            
            // If it's already a string, return it
            if (typeof field === 'string') {
                return field;
            }
            
            // If it's an object with language keys
            if (typeof field === 'object' && field !== null) {
                // Try to get the requested language
                const text = field[language];
                if (text && text.trim()) {
                    return text;
                }
                
                // Fallback to Russian if English is empty
                if (language === 'en' && field.ru && field.ru.trim()) {
                    return field.ru;
                }
                
                // Fallback to English if Russian is empty
                if (language === 'ru' && field.en && field.en.trim()) {
                    return field.en;
                }
                
                // Return any non-empty value
                return field.ru || field.en || '';
            }
            
            return '';
        }

        function displayStars(rating, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;

            for (let i = 0; i < 5; i++) {
                const star = document.createElement('i');
                if (i < fullStars) {
                    star.className = 'fas fa-star';
                } else if (i === fullStars && hasHalfStar) {
                    star.className = 'fas fa-star-half-alt';
                } else {
                    star.className = 'far fa-star';
                }
                container.appendChild(star);
            }
        }

        function getRatingsWord(count) {
            const remainder10 = count % 10;
            const remainder100 = count % 100;
            
            if (remainder10 === 1 && remainder100 !== 11) {
                return 'оценка';
            } else if (remainder10 >= 2 && remainder10 <= 4 && (remainder100 < 10 || remainder100 >= 20)) {
                return 'оценки';
            } else {
                return 'оценок';
            }
        }

        function showError() {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('error-state').classList.remove('hidden');
        }

        // Initialize i18n - update UI without reloading data
        window.addEventListener('languageChanged', (e) => {
            if (guideData) {
                // Обновляем отображение с сохранённой статистикой
                displayGuide(guideData, guideStats);
            }
        });

        // Download guide card as image
        async function downloadGuideCard() {
            const card = document.getElementById('guide-card');
            const downloadBtn = document.getElementById('download-card-btn');
            const guideName = document.getElementById('guide-name').textContent || 'guide';
            
            // Hide download button temporarily
            downloadBtn.style.display = 'none';
            
            try {
                // Show loading state on button
                const canvas = await html2canvas(card, {
                    backgroundColor: '#ffffff',
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    logging: false
                });
                
                // Create download link
                const link = document.createElement('a');
                link.download = `${guideName.replace(/\s+/g, '_')}_card.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
            } catch (error) {
                console.error('Error generating image:', error);
                alert('Ошибка при создании изображения. Попробуйте снова.');
            } finally {
                // Show download button again
                downloadBtn.style.display = 'block';
            }
        }
    </script>
