    <!-- РАННЯЯ ИНИЦИАЛИЗАЦИЯ ЯЗЫКА + ЗАЩИТА ОТ FOUC.
         Выполняется СИНХРОННО при парсинге <head>, ДО первой отрисовки <body>,
         поэтому браузер никогда не показывает русский текст разметки до перевода.
         Управляется из /public/js/i18n.js (снятие защиты после перевода).
         data-cfasync="false" — критично: запрещает Cloudflare Rocket Loader
         откладывать этот скрипт. Иначе он не выполнится до первой отрисовки и
         защита от FOUC не сработает (русский текст мелькнёт на продакшене). -->
    <script data-cfasync="false">
    (function () {
        try {
            var SUPPORTED = ['en', 'ru'];
            var lang = 'en'; // Язык по умолчанию — английский (фундаментальное правило проекта)
            try {
                var sess = sessionStorage.getItem('bt_lang');
                if (sess && SUPPORTED.indexOf(sess) !== -1) {
                    lang = sess;
                } else {
                    var stored = localStorage.getItem('selectedLanguage');
                    if (stored && SUPPORTED.indexOf(stored) !== -1) {
                        lang = stored;
                        try { sessionStorage.setItem('bt_lang', lang); } catch (e) {}
                    } else {
                        try { localStorage.setItem('selectedLanguage', 'en'); } catch (e) {}
                        try { sessionStorage.setItem('bt_lang', 'en'); } catch (e) {}
                    }
                }
            } catch (e) {}

            window.currentLanguage = lang;
            try { document.documentElement.lang = lang; } catch (e) {}
            window._i18nEarlyBoot = true;

            // reveal() снимает защиту от FOUC. Определяем ВСЕГДА (безопасный no-op,
            // если прятать нечего), т.к. на него могут ссылаться другие скрипты.
            function reveal() {
                try {
                    if (window._foucSafetyTimer) { clearTimeout(window._foucSafetyTimer); window._foucSafetyTimer = null; }
                    var s = document.getElementById('i18n-fouc-prevention');
                    if (s && s.parentNode) s.parentNode.removeChild(s);
                    if (document.body) document.body.style.opacity = '';
                } catch (e) {}
            }
            window._i18nReveal = reveal;

            // КЛЮЧЕВОЕ ДЛЯ СКОРОСТИ: разметка свёрстана на АНГЛИЙСКОМ (язык по умолчанию).
            // Для английского НЕ прячем body — страница отрисовывается мгновенно, без ожидания
            // загрузки большого i18n.js. Прячем и ждём перевода ТОЛЬКО если выбран не-английский
            // язык (напр. русский), чтобы не мелькнул английский текст до перевода на русский.
            if (lang !== 'en') {
                var style = document.createElement('style');
                style.id = 'i18n-fouc-prevention';
                style.textContent = 'body{opacity:0!important}';
                (document.head || document.documentElement).appendChild(style);

                // Подстраховка: если i18n.js не загрузится/не выполнится (404, ошибка скрипта),
                // показываем страницу по событию load, чтобы она не осталась пустой.
                window.addEventListener('load', function () { setTimeout(reveal, 0); });
                // Абсолютный предохранитель на случай зависшей сети (страница не должна
                // остаться пустой навсегда). При нормальной работе таймер снимается в i18n.js.
                window._foucSafetyTimer = setTimeout(reveal, 8000);
            }
        } catch (e) {}
    })();
    </script>

    <script data-cfasync="false">
        function applyLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawLang = urlParams.get('lang') || localStorage.getItem('selectedLanguage') || 'en';
            // Поддерживаем только en/ru. Любой другой язык (it, fr, de и т.д.) → en (наш дефолт).
            const lang = (rawLang === 'ru') ? 'ru' : 'en';
            localStorage.setItem('selectedLanguage', lang);
            document.documentElement.lang = lang;
            if (typeof window.updatePageLanguage === 'function') {
                window.updatePageLanguage(lang);
                return true;
            }
            return false;
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            if (!applyLanguage()) {
                let attempts = 0;
                const interval = setInterval(function() {
                    attempts++;
                    if (applyLanguage() || attempts > 20) {
                        clearInterval(interval);
                    }
                }, 200);
            }
            loadOrderDetails();
        });

        function loadOrderDetails() {
            // Show loading
            document.getElementById('loadingModal').classList.remove('hidden');
            
            // Get order information from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const orderNumber = urlParams.get('order') || urlParams.get('orderNumber');
            const orderData = sessionStorage.getItem('completedOrder');
            
            if (orderNumber) {
                // First verify payment status, then fetch full order details
                verifyAndFetchOrder(orderNumber);
            } else if (orderData) {
                // Use data from localStorage
                displayOrderDetails(JSON.parse(orderData));
                document.getElementById('loadingModal').classList.add('hidden');
            } else {
                // Default message if no order data
                displayDefaultSuccess();
                document.getElementById('loadingModal').classList.add('hidden');
            }
        }

        async function verifyAndFetchOrder(orderNumber) {
            try {
                // First, verify and update payment status with Payler
                const urlParams2 = new URLSearchParams(window.location.search);
                const verifyToken = urlParams2.get('vt') || undefined;
                const verifyBody = { orderNumber };
                if (verifyToken) verifyBody.verifyToken = verifyToken;
                
                const verifyResponse = await fetch('/api/payments/verify-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(verifyBody)
                });
                const verifyData = await verifyResponse.json();
                
                console.log('Payment verification result:', verifyData);
                
                if (verifyData.success && verifyData.data) {
                    const paymentStatus = verifyData.data.paymentStatus;
                    
                    // Check if payment was verified successfully
                    if (paymentStatus === 'paid') {
                        // Payment confirmed - fetch full order details
                        await fetchOrderDetails(orderNumber);
                        
                            if (verifyData.data.justVerified) {
                            const lang = getCurrentLang();
                            showNotification(lang === 'en' ? 'Payment confirmed!' : 'Платёж подтверждён!', 'success');
                        }
                    } else if (paymentStatus === 'failed' || paymentStatus === 'refunded') {
                        // Payment failed - show error page
                        showPaymentError(orderNumber, paymentStatus);
                    } else if (paymentStatus === 'processing') {
                        // Still processing - show waiting message
                        showProcessingStatus(orderNumber, verifyData.data);
                    } else {
                        // Unknown status - show default
                        await fetchOrderDetails(orderNumber);
                    }
                } else {
                    // Verification failed - try to fetch order anyway
                    await fetchOrderDetails(orderNumber);
                }
            } catch (error) {
                console.error('Error verifying payment:', error);
                // Fallback to just fetching order
                await fetchOrderDetails(orderNumber);
            } finally {
                document.getElementById('loadingModal').classList.add('hidden');
            }
        }

        async function fetchOrderDetails(orderNumber) {
            try {
                const lang = getCurrentLang();
                const response = await fetch(`/api/orders/number/${orderNumber}?lang=${lang}`);
                const data = await response.json();
                
                if (data.success) {
                    displayOrderDetails(data.data);
                } else {
                    displayDefaultSuccess();
                }
            } catch (error) {
                console.error('Error fetching order details:', error);
                displayDefaultSuccess();
            }
        }
        
        function showPaymentError(orderNumber, status) {
            const container = document.querySelector('.success-container');
            if (!container) return;
            const lang = getCurrentLang();
            const title = status === 'refunded' 
                ? (lang === 'en' ? 'Payment Refunded' : 'Платёж возвращён')
                : (lang === 'en' ? 'Payment Failed' : 'Платёж не прошёл');
            const text = lang === 'en' ? 'Unfortunately, your payment was not completed successfully.' : 'К сожалению, ваш платёж не был завершён успешно.';
            const orderLabel = lang === 'en' ? 'Order number:' : 'Номер заказа:';
            const homeText = lang === 'en' ? 'Return to home' : 'На главную';
            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-2xl p-8 text-center card-shadow">
                    <div class="mx-auto w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mb-6">
                        <i class="fas fa-times text-3xl text-red-600"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900 mb-4">${title}</h1>
                    <p class="text-gray-600 mb-6">${text}</p>
                    <div class="bg-gray-50 rounded-lg p-4 mb-6">
                        <p class="text-sm text-gray-500">${orderLabel} <span class="font-medium">${orderNumber}</span></p>
                    </div>
                    <div class="space-y-3">
                        <a href="/" class="block w-full bg-gray-600 hover:bg-gray-700 text-white py-3 px-6 rounded-lg font-medium transition-colors">
                            <i class="fas fa-home mr-2"></i>${homeText}
                        </a>
                    </div>
                </div>
            `;
        }
        
        function showProcessingStatus(orderNumber, data) {
            const container = document.querySelector('.success-container');
            if (!container) return;
            const lang = getCurrentLang();
            const paylerStatus = data.paylerStatus || (lang === 'en' ? 'Processing' : 'Обработка');
            const title = lang === 'en' ? 'Processing Payment' : 'Обработка платежа';
            const text = lang === 'en' ? 'Your payment is being processed.' : 'Ваш платёж находится в обработке.';
            const statusLabel = lang === 'en' ? 'Status:' : 'Статус:';
            const orderLabel = lang === 'en' ? 'Order number:' : 'Номер заказа:';
            const refreshText = lang === 'en' ? 'Refresh status' : 'Обновить статус';
            const homeText = lang === 'en' ? 'Return to home' : 'На главную';
            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-2xl p-8 text-center card-shadow">
                    <div class="mx-auto w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mb-6">
                        <i class="fas fa-clock text-3xl text-yellow-600 animate-pulse"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900 mb-4">${title}</h1>
                    <p class="text-gray-600 mb-2">${text}</p>
                    <div class="bg-gray-50 rounded-lg p-4 mb-6">
                        <p class="text-sm text-gray-500 mb-1">${statusLabel} <span class="font-medium">${paylerStatus}</span></p>
                        <p class="text-sm text-gray-500">${orderLabel} <span class="font-medium">${orderNumber}</span></p>
                    </div>
                    <div class="space-y-3">
                        <button onclick="location.reload()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 px-6 rounded-lg font-medium transition-colors">
                            <i class="fas fa-sync mr-2"></i>${refreshText}
                        </button>
                        <a href="/" class="block w-full border border-gray-300 hover:bg-gray-50 text-gray-700 py-3 px-6 rounded-lg font-medium transition-colors">
                            <i class="fas fa-home mr-2"></i>${homeText}
                        </a>
                    </div>
                </div>
            `;
        }
        
        function showNotification(message, type = 'success') {
            try {
                const notification = document.createElement('div');
                notification.className = `fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg text-white transition-opacity duration-300 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
                notification.textContent = message;
                document.body.appendChild(notification);
                setTimeout(() => {
                    notification.style.opacity = '0';
                    setTimeout(() => notification.remove(), 300);
                }, 3000);
            } catch (e) {
                console.log('Notification:', message);
            }
        }

        function getCurrentLang() {
            const urlParams = new URLSearchParams(window.location.search);
            const raw = urlParams.get('lang') || localStorage.getItem('selectedLanguage') || 'en';
            // Поддерживаем только en/ru. Любой другой язык (it, fr, de и т.д.) → en (наш дефолт).
            return (raw === 'ru') ? 'ru' : 'en';
        }

        function displayOrderDetails(order) {
            if (order) {
                const lang = getCurrentLang();
                const orderNum = order.orderNumber || '№' + order.id;
                document.getElementById('orderNumber').textContent = orderNum;
                
                let serviceType = lang === 'en' ? 'Service' : 'Услуга';
                let serviceName = lang === 'en' ? 'Tour' : 'Тур';
                
                if (orderNum.startsWith('GH-')) {
                    serviceType = lang === 'en' ? 'Guide' : 'Гид';
                    const guideName = order.guideHireRequest?.guide?.name;
                    serviceName = (typeof guideName === 'object' && guideName !== null) 
                        ? (guideName[lang] || guideName.ru || guideName.en) 
                        : (guideName || (lang === 'en' ? 'Guide Hire' : 'Найм гида'));
                } else if (orderNum.startsWith('TR-')) {
                    serviceType = lang === 'en' ? 'Transfer' : 'Трансфер';
                    const pickup = order.transferRequest?.pickupLocation || '';
                    const dropoff = order.transferRequest?.dropoffLocation || '';
                    serviceName = pickup && dropoff ? `${pickup} → ${dropoff}` : (lang === 'en' ? 'Transfer' : 'Трансфер');
                } else if (orderNum.startsWith('CT-')) {
                    serviceType = lang === 'en' ? 'Custom Tour' : 'Собственный тур';
                    serviceName = lang === 'en' ? 'Custom Tour' : 'Индивидуальный тур';
                } else {
                    serviceType = lang === 'en' ? 'Tour' : 'Тур';
                    const tourTitle = order.tour?.title;
                    if (typeof tourTitle === 'object' && tourTitle !== null) {
                        serviceName = tourTitle[lang] || tourTitle.ru || tourTitle.en || (lang === 'en' ? 'Tour in Tajikistan' : 'Тур по Таджикистану');
                    } else if (typeof tourTitle === 'string' && tourTitle) {
                        try {
                            const parsed = JSON.parse(tourTitle);
                            serviceName = (typeof parsed === 'object' && parsed !== null) ? (parsed[lang] || parsed.ru || parsed.en || tourTitle) : tourTitle;
                        } catch(e) {
                            serviceName = tourTitle;
                        }
                    } else {
                        serviceName = lang === 'en' ? 'Tour in Tajikistan' : 'Тур по Таджикистану';
                    }
                }
                
                document.getElementById('serviceTypeLabel').textContent = serviceType + ':';
                document.getElementById('serviceName').textContent = serviceName;
                document.getElementById('totalAmount').textContent = `${parseFloat(order.totalAmount).toFixed(2)} TJS`;
                
                // Format payment method
                const paymentMethodNames = {
                    'alif': 'AlifPay',
                    'payler': 'Payler',
                    'stripe': 'Stripe',
                    'card': 'Банковская карта'
                };
                document.getElementById('paymentMethod').textContent = 
                    paymentMethodNames[order.paymentMethod] || order.paymentMethod || 'Банковская карта';
                
                // 📊 GA4 Enhanced Ecommerce + Enhanced Conversions — purchase event with real order data
                // (Google Ads conversion snippet fires immediately in <head> via static script)
                try {
                    const orderAmount = parseFloat(order.totalAmount) || 0;
                    const orderCurrency = order.currency || 'TJS';

                    // Разбиваем полное имя на имя и фамилию
                    const fullName = order.customer?.fullName || '';
                    const nameParts = fullName.trim().split(/\s+/);
                    const firstName = nameParts[0] || '';
                    const lastName = nameParts.slice(1).join(' ') || '';

                    // Нормализуем телефон: убираем всё кроме цифр и ведущего +
                    const rawPhone = order.customer?.phone || '';
                    const normalizedPhone = rawPhone.startsWith('+')
                        ? '+' + rawPhone.replace(/\D/g, '')
                        : rawPhone.replace(/\D/g, '')
                            ? '+' + rawPhone.replace(/\D/g, '')
                            : '';

                    window.dataLayer = window.dataLayer || [];
                    window.dataLayer.push({
                        event: 'purchase',
                        ecommerce: {
                            transaction_id: orderNum,
                            value: orderAmount,
                            currency: orderCurrency,
                            items: [{
                                item_id: order.tourId ? 'TOUR-' + order.tourId : orderNum,
                                item_name: serviceName,
                                price: orderAmount,
                                quantity: 1
                            }]
                        },
                        // Enhanced Conversions: GTM сам захэширует email и телефон перед отправкой в Google
                        user_data: {
                            email: order.customer?.email || '',
                            phone_number: normalizedPhone,
                            address: {
                                first_name: firstName,
                                last_name: lastName,
                                country: 'TJ'
                            }
                        }
                    });
                    console.log('📊 GA4 purchase event sent:', { orderNum, orderAmount, orderCurrency, hasUserData: !!order.customer?.email });
                } catch (e) {}
            }
        }

        function displayDefaultSuccess() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderNumber = urlParams.get('order') || urlParams.get('orderNumber') || '';
            const lang = getCurrentLang();
            
            let serviceType = lang === 'en' ? 'Service' : 'Услуга';
            let serviceName = lang === 'en' ? 'Service paid' : 'Услуга оплачена';
            
            if (orderNumber.startsWith('GH-')) {
                serviceType = lang === 'en' ? 'Guide' : 'Гид';
                serviceName = lang === 'en' ? 'Guide Hire' : 'Найм гида';
            } else if (orderNumber.startsWith('TR-')) {
                serviceType = lang === 'en' ? 'Transfer' : 'Трансфер';
                serviceName = lang === 'en' ? 'Transfer' : 'Трансфер';
            } else if (orderNumber.startsWith('CT-')) {
                serviceType = lang === 'en' ? 'Custom Tour' : 'Собственный тур';
                serviceName = lang === 'en' ? 'Custom Tour' : 'Индивидуальный тур';
            } else {
                serviceType = lang === 'en' ? 'Tour' : 'Тур';
                serviceName = lang === 'en' ? 'Tour in Tajikistan' : 'Тур по Таджикистану';
            }
            
            document.getElementById('orderNumber').textContent = orderNumber || (lang === 'en' ? 'Successfully paid' : 'Успешно оплачен');
            document.getElementById('serviceTypeLabel').textContent = serviceType + ':';
            document.getElementById('serviceName').textContent = serviceName;
            document.getElementById('totalAmount').textContent = '...';
            document.getElementById('paymentMethod').textContent = '...';
        }

        function downloadReceipt() {
            const orderNumber = document.getElementById('orderNumber').textContent;
            
            if (orderNumber && orderNumber !== '...' && orderNumber !== 'Успешно оплачен' && orderNumber !== 'Successfully paid') {
                const lang = getCurrentLang();
                const link = document.createElement('a');
                link.href = `/api/orders/${orderNumber}/receipt?lang=${lang}`;
                link.download = `receipt-${orderNumber}.html`;
                link.click();
            } else {
                const lang = getCurrentLang();
                alert(lang === 'en' ? 'Order information is unavailable' : 'Информация о заказе недоступна');
            }
        }

        function goHome() {
            // Clear any stored booking data
            sessionStorage.removeItem('bookingState');
            sessionStorage.removeItem('completedOrder');
            
            // Redirect to home
            window.location.href = '/';
        }

        // Auto-clear sessionStorage after 5 minutes to prevent clutter
        setTimeout(() => {
            sessionStorage.removeItem('completedOrder');
        }, 5 * 60 * 1000);
    </script>
    
    <!-- Footer Container for dynamic footer -->
    <div id="footer-container"></div>
    
    <!-- Layout Loader for dynamic header/footer -->
    <script data-cfasync="false" src="/public/js/layout-loader.js"></script>
</body>
</html>
