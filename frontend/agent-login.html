<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <!-- i18n-early-boot:start -->
    <!-- РАННЯЯ ИНИЦИАЛИЗАЦИЯ ЯЗЫКА + ЗАЩИТА ОТ FOUC.
         Выполняется СИНХРОННО при парсинге <head>, ДО первой отрисовки <body>,
         поэтому браузер никогда не показывает русский текст разметки до перевода.
         Управляется из /public/js/i18n.js (снятие защиты после перевода).
         data-cfasync="false" — критично: запрещает Cloudflare Rocket Loader
         откладывать этот скрипт. Иначе он не выполнится до первой отрисовки и
         защита от FOUC не сработает (русский текст мелькнёт на продакшене). -->
    <script data-cfasync="false">
    (function () {
        try {
            var SUPPORTED = ['en', 'ru'];
            var lang = 'en'; // Язык по умолчанию — английский (фундаментальное правило проекта)
            try {
                var sess = sessionStorage.getItem('bt_lang');
                if (sess && SUPPORTED.indexOf(sess) !== -1) {
                    lang = sess;
                } else {
                    var stored = localStorage.getItem('selectedLanguage');
                    if (stored && SUPPORTED.indexOf(stored) !== -1) {
                        lang = stored;
                        try { sessionStorage.setItem('bt_lang', lang); } catch (e) {}
                    } else {
                        try { localStorage.setItem('selectedLanguage', 'en'); } catch (e) {}
                        try { sessionStorage.setItem('bt_lang', 'en'); } catch (e) {}
                    }
                }
            } catch (e) {}

            window.currentLanguage = lang;
            try { document.documentElement.lang = lang; } catch (e) {}
            window._i18nEarlyBoot = true;

            // reveal() снимает защиту от FOUC. Определяем ВСЕГДА (безопасный no-op,
            // если прятать нечего), т.к. на него могут ссылаться другие скрипты.
            function reveal() {
                try {
                    if (window._foucSafetyTimer) { clearTimeout(window._foucSafetyTimer); window._foucSafetyTimer = null; }
                    var s = document.getElementById('i18n-fouc-prevention');
                    if (s && s.parentNode) s.parentNode.removeChild(s);
                    if (document.body) document.body.style.opacity = '';
                } catch (e) {}
            }
            window._i18nReveal = reveal;

            // КЛЮЧЕВОЕ ДЛЯ СКОРОСТИ: разметка свёрстана на АНГЛИЙСКОМ (язык по умолчанию).
            // Для английского НЕ прячем body — страница отрисовывается мгновенно, без ожидания
            // загрузки большого i18n.js. Прячем и ждём перевода ТОЛЬКО если выбран не-английский
            // язык (напр. русский), чтобы не мелькнул английский текст до перевода на русский.
            if (lang !== 'en') {
                var style = document.createElement('style');
                style.id = 'i18n-fouc-prevention';
                style.textContent = 'body{opacity:0!important}';
                (document.head || document.documentElement).appendChild(style);

                // Подстраховка: если i18n.js не загрузится/не выполнится (404, ошибка скрипта),
                // показываем страницу по событию load, чтобы она не осталась пустой.
                window.addEventListener('load', function () { setTimeout(reveal, 0); });
                // Абсолютный предохранитель на случай зависшей сети (страница не должна
                // остаться пустой навсегда). При нормальной работе таймер снимается в i18n.js.
                window._foucSafetyTimer = setTimeout(reveal, 8000);
            }
        } catch (e) {}
    })();
    </script>
    <!-- i18n-early-boot:end -->
    <link rel="icon" type="image/png" href="/Logo-Ru_1754635713718.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="agent.login_title">Agent Login - Bunyod-Tour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
    </style>
    <link rel="stylesheet" href="/public/css/tailwind.css">
    <script data-cfasync="false" defer src="/public/js/i18n.js"></script>
    <script data-cfasync="false" defer src="/public/js/layout-loader.js"></script>
    <link rel="stylesheet" href="/public/css/layout.css">
    <style>
        .hero-gradient {
            background: linear-gradient(135deg, #2F2F2F 0%, #3E3E3E 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeInUp { animation: fadeInUp 0.8s ease-out; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="header-placeholder"></div>

    <!-- Hero Section -->
    <section class="hero-gradient text-white py-16">
        <div class="max-w-6xl mx-auto px-4 text-center animate-fadeInUp">
            <h1 class="text-4xl md:text-5xl font-bold mb-4" data-translate="agent.login_hero_title">Travel Agent Login</h1>
            <p class="text-xl opacity-90" data-translate="agent.login_hero_subtitle">Login to your B2B travel agent dashboard</p>
        </div>
    </section>

    <!-- Login Form -->
    <section class="py-16">
        <div class="max-w-md mx-auto px-4">
            <div class="glass-card rounded-3xl shadow-2xl p-8 md:p-10">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-gray-800" data-translate="agent.login_form_title">Login</h2>
                </div>

                <div id="errorMessage" class="hidden bg-red-50 border-l-4 border-red-500 text-red-800 p-4 rounded-lg mb-6">
                    <span id="errorText"></span>
                </div>

                <form id="loginForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2" data-translate="agent.email">
                            Email <span class="text-red-500">*</span>
                        </label>
                        <input type="email" id="email" name="email" required
                            class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-gray-800 focus:outline-none transition-colors"
                            placeholder="your@email.com">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2" data-translate="agent.password">Password<span class="text-red-500">*</span>
                        </label>
                        <input type="password" id="password" name="password" required
                            class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-gray-800 focus:outline-none transition-colors">
                    </div>

                    <button type="submit" id="loginBtn"
                        class="w-full bg-gradient-to-r from-gray-800 to-gray-900 text-white font-semibold py-4 rounded-xl hover:from-gray-900 hover:to-black transition-all duration-300 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg">
                        <span data-translate="agent.login_button">Login</span>
                    </button>
                </form>

                <div class="mt-8 pt-6 border-t border-gray-200 text-center">
                    <p class="text-gray-600">
                        <span data-translate="agent.no_account">Don't have an account?</span>
                        <a href="/travel-agent-apply.html" class="text-gray-800 font-semibold hover:underline ml-1" data-translate="agent.apply_link">Apply for partnership</a>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script data-cfasync="false">
        const t = (key) => window.getTranslation ? window.getTranslation(key, window.currentLanguage || 'ru') : key;

        const loginForm = document.getElementById('loginForm');
        if (loginForm) loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const emailEl = document.getElementById('email');
            const passwordEl = document.getElementById('password');
            const email = emailEl ? emailEl.value.trim() : '';
            const password = passwordEl ? passwordEl.value : '';
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnSpan = loginBtn ? loginBtn.querySelector('span') : null;

            errorMessage.classList.add('hidden');

            if (!email || !password) {
                errorText.textContent = t('agent.fill_all_fields');
                errorMessage.classList.remove('hidden');
                return;
            }

            loginBtn.disabled = true;
            if (loginBtnSpan) loginBtnSpan.textContent = t('agent.logging_in');

            try {
                const response = await fetch('/api/travel-agents/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('agentToken', data.data.token);
                    localStorage.setItem('agentInfo', JSON.stringify(data.data.agent));

                    if (data.data.agent.mustChangePassword) {
                        window.location.href = '/agent-dashboard.html?changePassword=true';
                    } else {
                        window.location.href = '/agent-dashboard.html';
                    }
                } else {
                    errorText.textContent = data.message || t('agent.invalid_credentials');
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorText.textContent = t('agent.login_error_general');
                errorMessage.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                if (loginBtnSpan) loginBtnSpan.textContent = t('agent.login_button');
            }
        });

        window.addEventListener('languageChanged', () => {
            const loginBtnSpan = document.querySelector('#loginBtn span');
            if (loginBtnSpan && !document.getElementById('loginBtn').disabled) {
                loginBtnSpan.textContent = t('agent.login_button');
            }
        });
    </script>
</body>
</html>
